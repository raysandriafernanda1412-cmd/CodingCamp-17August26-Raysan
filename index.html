<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Budget Visualizer</h1>
      <button id="themeToggleBtn" type="button" aria-label="Toggle Mode">🌙</button>
    </header>

    <!-- Kartu Ringkasan Saldo & Batas Limit -->
    <section class="summary-card">
      <div class="balance-info">
        <h3>Total Balance</h3>
        <p id="totalBalance">Rp 0</p>
      </div>
      <div class="limit-setting">
        <label for="budgetLimit">Limit Warning (Rp):</label>
        <input type="number" id="budgetLimit" placeholder="Contoh: 100000" min="0">
      </div>
    </section>

    <!-- Form Tambah Transaksi -->
    <section class="form-section">
      <h2>Tambah Transaksi</h2>
      <form id="transactionForm" onsubmit="return false;">
        <input type="text" id="descInput" placeholder="Deskripsi (misal: Makan Siang)" required>
        <input type="number" id="amountInput" placeholder="Harga (Rp)" required>
        <div class="category-select-group">
          <select id="categorySelect" required>
            <option value="Makanan">Makanan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Belanja">Belanja</option>
          </select>
          <button type="button" id="addCategoryBtn">+ Kategori</button>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary">Simpan Transaksi</button>
      </form>   
    </section>

    <!-- Visualisasi Grafik -->
    <section class="chart-section">
      <h2>Pengeluaran per Kategori</h2>
      <div class="chart-wrapper">
        <canvas id="categoryChart"></canvas>
      </div>
    </section>

    <!-- Riwayat Transaksi -->
    <section class="history-section">
      <h2>Riwayat Transaksi</h2>
      <ul id="transactionList" class="transaction-list"></ul>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
